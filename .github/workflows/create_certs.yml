name: 3. Create Certificates
run-name: Create Certificates (${{ github.ref_name }})

on: [workflow_call, workflow_dispatch]

env:
  TEAMID: ${{ secrets.TEAMID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GH_TOKEN: ${{ secrets.GH_PAT }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  create_certs:
    name: Check Caregiver signing assets (no revocation)
    needs: validate
    runs-on: macos-26-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install project dependencies
        run: bundle install

      - name: Check existing Caregiver certificates and profiles
        run: |
          set -e
          echo 'Checking Caregiver signing assets. No certificates will be revoked.'
          bundle exec fastlane certs

      - name: Success
        if: success()
        run: echo 'Caregiver signing assets passed Fastlane match validation.'
