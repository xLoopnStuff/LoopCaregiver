name: Repair Caregiver signing using original Loop P12

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caregiver-signing-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      LOOP_MATCH_PASSWORD: ${{ secrets.LOOP_MATCH_PASSWORD }}
      CAREGIVER_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    steps:
      - name: Checkout LoopCaregiver
        uses: actions/checkout@v5
      - name: Install dependencies
        run: bundle install
      - name: Copy original working Loop signing files to new isolated branch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for v in TEAMID GH_PAT LOOP_MATCH_PASSWORD CAREGIVER_MATCH_PASSWORD; do
            [[ -n "${!v:-}" ]] || { echo "::error::Missing secret $v"; exit 1; }
          done
          TMP="$(mktemp -d "$RUNNER_TEMP/caregiver-original.XXXXXX")"
          KC="caregiver-original-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          KCPASS="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$KC" >/dev/null 2>&1 || true
            rm -rf "$TMP"
          }
          trap cleanup EXIT
          AUTH="$(printf '%s:%s' "$GITHUB_REPOSITORY_OWNER" "$GH_PAT" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q --branch master \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}/Match-Secrets.git" "$TMP/source"
          MATCH_PASSWORD="$LOOP_MATCH_PASSWORD" bundle exec ruby -r match/encryption/openssl -e \
            'Match::Encryption::OpenSSL.new(working_directory: ARGV.fetch(0)).decrypt_files' "$TMP/source"

          # Copy the ORIGINAL Match P12, not an OpenSSL-repacked copy.
          # This is the exact format that the working Loop workflow imports.
          CERT=''
          P12=''
          for c in "$TMP"/source/certs/distribution/*.cer; do
            [[ -f "$c" ]] || continue
            p="${c%.cer}.p12"
            [[ -f "$p" ]] || continue
            if openssl x509 -inform DER -in "$c" -noout -checkend 86400 >/dev/null 2>&1; then
              [[ -z "$CERT" ]] || { echo '::error::Multiple valid certificate pairs; refusing ambiguous choice'; exit 1; }
              CERT="$c"
              P12="$p"
            fi
          done
          [[ -n "$CERT" && -n "$P12" ]] || { echo '::error::No current Loop distribution certificate/P12 pair'; exit 1; }
          NAME="$(basename "$CERT" .cer)"

          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q --branch master \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}/Match-Caregiver.git" "$TMP/dest"
          cd "$TMP/dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="caregiver-original-p12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -q --orphan "$BRANCH"
          git rm -q -rf --ignore-unmatch .
          git clean -q -fdx
          mkdir -p certs/distribution
          cp "$CERT" "certs/distribution/${NAME}.cer"
          cp "$P12" "certs/distribution/${NAME}.p12"
          MATCH_PASSWORD="$CAREGIVER_MATCH_PASSWORD" bundle exec ruby -r match/encryption/openssl -e \
            'Match::Encryption::OpenSSL.new(working_directory: ARGV.fetch(0)).encrypt_files' "$TMP/dest"
          git add certs/distribution
          git commit -qm 'Stage original working Loop P12 for Caregiver'
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push -q origin "$BRANCH"

          # Read-only end-to-end check: decryption and macOS code-signing identity.
          cd "$GITHUB_WORKSPACE"
          security create-keychain -p "$KCPASS" "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          MATCH_PASSWORD="$CAREGIVER_MATCH_PASSWORD" bundle exec fastlane match appstore \
            --readonly true \
            --git_url "https://github.com/${GITHUB_REPOSITORY_OWNER}/Match-Caregiver.git" \
            --git_branch "$BRANCH" \
            --git_basic_authorization "$AUTH" \
            --app_identifier "com.${TEAMID}.loopkit.LoopCaregiver" \
            --skip_provisioning_profiles true \
            --keychain_name "$KC" \
            --keychain_password "$KCPASS"
          COUNT="$(security find-identity -v -p codesigning "$KC" | awk '/valid identities found/ {print $1}' | tail -1)"
          [[ "$COUNT" == 1 ]] || { echo '::error::Original P12 did not import as a valid signing identity'; exit 1; }
          echo "::notice::SUCCESS: Original Loop P12 verified on $BRANCH. No Apple profiles or master branches changed."
