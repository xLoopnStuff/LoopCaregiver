name: Stage Caregiver signing repair (reuse Loop certificate)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caregiver-signing-repair
  cancel-in-progress: false

jobs:
  stage-repair:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      LOOP_MATCH_PASSWORD: ${{ secrets.LOOP_MATCH_PASSWORD }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
    steps:
      - name: Checkout LoopCaregiver
        uses: actions/checkout@v5

      - name: Install dependencies
        run: bundle install

      - name: Stage certificate in a separate Match-Caregiver branch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for v in TEAMID GH_PAT LOOP_MATCH_PASSWORD MATCH_PASSWORD FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY; do
            [[ -n "${!v:-}" ]] || { echo "::error::Missing secret $v"; exit 1; }
          done

          TMP="$(mktemp -d "$RUNNER_TEMP/caregiver-repair.XXXXXX")"
          KC="caregiver-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          KCPASS="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$KC" >/dev/null 2>&1 || true
            rm -rf "$TMP"
          }
          trap cleanup EXIT

          security create-keychain -p "$KCPASS" "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          AUTH="$(printf '%s:%s' "$GITHUB_REPOSITORY_OWNER" "$GH_PAT" | base64 | tr -d '\n')"

          # Import Loop's known-working identity via Fastlane, not OpenSSL guessing.
          export MATCH_PASSWORD="$LOOP_MATCH_PASSWORD" MATCH_READONLY=true
          bundle exec fastlane match appstore \
            --readonly true \
            --git_url "https://github.com/${GITHUB_REPOSITORY_OWNER}/Match-Secrets.git" \
            --git_branch master \
            --git_basic_authorization "$AUTH" \
            --app_identifier "com.${TEAMID}.loopkit.Loop" \
            --skip_provisioning_profiles true \
            --keychain_name "$KC" \
            --keychain_password "$KCPASS"

          COUNT="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*\([0-9][0-9]*\) valid identities found.*/\1/p' | tail -1)"
          [[ "$COUNT" == 1 ]] || { echo '::error::Expected one valid Loop signing identity'; exit 1; }

          # Export from the temporary keychain, then normalize to an empty-PIN P12
          # for Match's standard keychain import path. Never print/export artifacts.
          export EXPORT_PASS="$(openssl rand -hex 32)"
          security export -k "$KC" -t identities -f pkcs12 \
            -P "$EXPORT_PASS" -o "$TMP/exported.p12" >/dev/null
          openssl pkcs12 -legacy -in "$TMP/exported.p12" \
            -passin env:EXPORT_PASS -nodes -out "$TMP/identity.pem" >/dev/null 2>&1
          openssl pkcs12 -export -in "$TMP/identity.pem" \
            -out "$TMP/6BPX56RNHV.p12" -passout pass: >/dev/null 2>&1
          openssl pkcs12 -in "$TMP/6BPX56RNHV.p12" -passin pass: \
            -nocerts -nodes 2>/dev/null | openssl pkey -noout >/dev/null 2>&1
          rm -f "$TMP/exported.p12" "$TMP/identity.pem"
          unset EXPORT_PASS

          # Fetch and decrypt Loop's public certificate, and verify it matches P12.
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q \
            --branch master "https://github.com/$GITHUB_REPOSITORY_OWNER/Match-Secrets.git" "$TMP/source"
          MATCH_PASSWORD="$LOOP_MATCH_PASSWORD" bundle exec ruby -r match/encryption/openssl -e \
            'Match::Encryption::OpenSSL.new(working_directory: ARGV.fetch(0)).decrypt_files' "$TMP/source"
          cp "$TMP/source/certs/distribution/6BPX56RNHV.cer" "$TMP/6BPX56RNHV.cer"
          CER_FP="$(openssl x509 -inform DER -in "$TMP/6BPX56RNHV.cer" -noout -fingerprint -sha256)"
          P12_FP="$(openssl pkcs12 -in "$TMP/6BPX56RNHV.p12" -passin pass: -clcerts -nokeys 2>/dev/null | openssl x509 -noout -fingerprint -sha256)"
          [[ "$CER_FP" == "$P12_FP" ]] || { echo '::error::Exported identity does not match Loop certificate'; exit 1; }

          # Make changes only in a NEW branch, never in master.
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone -q \
            --branch master "https://github.com/$GITHUB_REPOSITORY_OWNER/Match-Caregiver.git" "$TMP/dest"
          cd "$TMP/dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="caregiver-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -q -b "$BRANCH"

          MATCH_PASSWORD="$MATCH_PASSWORD" bundle exec ruby -r match/encryption/openssl -e \
            'Match::Encryption::OpenSSL.new(working_directory: ARGV.fetch(0)).decrypt_files' "$TMP/dest"
          mkdir -p certs/distribution
          find certs/distribution -maxdepth 1 -type f \( -name '*.cer' -o -name '*.p12' \) -delete
          rm -rf profiles/appstore
          cp "$TMP/6BPX56RNHV.cer" certs/distribution/
          cp "$TMP/6BPX56RNHV.p12" certs/distribution/
          MATCH_PASSWORD="$MATCH_PASSWORD" bundle exec ruby -r match/encryption/openssl -e \
            'Match::Encryption::OpenSSL.new(working_directory: ARGV.fetch(0)).encrypt_files' "$TMP/dest"
          git add -A
          git commit -qm 'Stage Caregiver signing with existing Loop distribution identity'
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push -q origin "$BRANCH"
          echo "REPAIR_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "::notice::Staged encrypted signing files on $BRANCH; master unchanged."

      - name: Generate Caregiver profiles on repair branch
        shell: bash
        env:
          MATCH_READONLY: 'false'
          MATCH_GENERATE_APPLE_CERTS: 'false'
        run: |
          set -euo pipefail
          # The existing Fastfile's certs lane uses all five Caregiver bundle IDs.
          # This runs only against the isolated branch, not master.
          bundle exec fastlane certs

      - name: Verify all five profiles and signing identity on repair branch
        shell: bash
        env:
          MATCH_READONLY: 'true'
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "$GITHUB_REPOSITORY_OWNER" "$GH_PAT" | base64 | tr -d '\n')"
          bundle exec fastlane match appstore \
            --readonly true \
            --git_url "https://github.com/${GITHUB_REPOSITORY_OWNER}/Match-Caregiver.git" \
            --git_branch "$MATCH_GIT_BRANCH" \
            --git_basic_authorization "$AUTH" \
            --app_identifier "com.${TEAMID}.loopkit.LoopCaregiver,com.${TEAMID}.loopkit.LoopCaregiver.IntentExtension,com.${TEAMID}.loopkit.LoopCaregiver.WidgetExtension,com.${TEAMID}.loopkit.LoopCaregiver.watchkitapp,com.${TEAMID}.loopkit.LoopCaregiver.watchkitapp.WidgetExtension"
          echo "::notice::Repair branch $MATCH_GIT_BRANCH verified. Match-Caregiver master has NOT been changed."
